name: Audit Dhole scope usage

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/audit-scope-usage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Audit registered scopes against source usage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, subprocess, shutil

          repos = [
              'DholeConfigService', 'DholeAuditLogsService', 'DholeDataExtractionService',
              'DholePricingService', 'DholeAIService', 'DholeStorageService',
              'DholeReportsService', 'DholeNotificationsService', 'DholeApiGateway', 'DholeWeb'
          ]
          root = pathlib.Path('.scope-audit')
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir()

          for repo in repos:
              target = root / repo
              url = f'https://github.com/CustomCodeCR/{repo}.git'
              cmd = ['git', 'clone', '--depth', '1', '--branch', 'develop', url, str(target)]
              if subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0:
                  subprocess.run(['git', 'clone', '--depth', '1', '--branch', 'master', url, str(target)], check=True, stdout=subprocess.DEVNULL)

          catalog_dir = pathlib.Path('src/Dhole.Auth.Persistence/Seed/ScopeCatalog')
          pattern = re.compile(r'ScopeCatalog\.Create\(\s*"([^"]+)"', re.S)
          scopes = []
          for file in sorted(catalog_dir.glob('*.cs')):
              scopes.extend(pattern.findall(file.read_text(encoding='utf-8-sig')))
          scopes = sorted(set(scopes))

          roots = [('DholeAuthService', pathlib.Path('src'))]
          roots += [(p.name, p / 'src') for p in root.iterdir() if (p / 'src').exists()]

          exts = {'.cs', '.ts', '.vue', '.js', '.tsx', '.jsx'}
          excluded_parts = {'bin', 'obj', 'dist', 'node_modules', 'Migrations', 'Seed', 'tests', 'test'}

          def classification(path: pathlib.Path):
              low = str(path).lower()
              if any(k in low for k in ('scope', 'authorization', 'permission', 'constant')):
                  return 'definition-like'
              return 'runtime'

          print(f'TOTAL_REGISTERED_SCOPES={len(scopes)}')
          unused = []
          definition_only = []
          used = []

          for scope in scopes:
              hits = []
              for repo_name, base in roots:
                  if not base.exists():
                      continue
                  for file in base.rglob('*'):
                      if not file.is_file() or file.suffix.lower() not in exts:
                          continue
                      if any(part in excluded_parts for part in file.parts):
                          continue
                      try:
                          text = file.read_text(encoding='utf-8-sig', errors='ignore')
                      except Exception:
                          continue
                      if scope not in text:
                          continue
                      for n, line in enumerate(text.splitlines(), 1):
                          if scope in line:
                              hits.append((repo_name, str(file), n, classification(file), line.strip()[:240]))
              runtime_hits = [h for h in hits if h[3] == 'runtime']
              if not hits:
                  unused.append(scope)
                  state = 'UNUSED'
              elif not runtime_hits:
                  definition_only.append(scope)
                  state = 'DEFINITION_ONLY'
              else:
                  used.append(scope)
                  state = 'USED'
              print(f'\n[{state}] {scope}')
              for h in hits[:20]:
                  print(f'  {h[0]}::{h[1]}:{h[2]} [{h[3]}] {h[4]}')
              if len(hits) > 20:
                  print(f'  ... {len(hits)-20} more literal hits')

          print('\n=== CANDIDATES: ZERO LITERAL USAGE ===')
          for s in unused: print(s)
          print('\n=== CANDIDATES: DEFINITION FILES ONLY ===')
          for s in definition_only: print(s)
          print(f'\nSUMMARY used={len(used)} definition_only={len(definition_only)} unused={len(unused)}')
          PY
