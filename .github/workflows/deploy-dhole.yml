name: Deploy Dhole Auth

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhole-auth-deploy
  cancel-in-progress: true

env:
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Verify server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -r /opt/dhole/.env
          test -r "$COMPOSE_FILE"
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q

      - name: Build images
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull -f src/Dhole.Auth.Api/Dockerfile -t dhole/auth-api:latest -t "dhole/auth-api:$SHA_TAG" .
          docker build --pull -f src/Dhole.Auth.Workers/Dockerfile -t dhole/auth-workers:latest -t "dhole/auth-workers:$SHA_TAG" .

      - name: Deploy Auth
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never auth-api auth-workers
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps auth-api auth-workers

      - name: Cleanup old images
        run: docker image prune -f
